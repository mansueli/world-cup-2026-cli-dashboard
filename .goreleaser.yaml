version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

universal_binaries:
  - replace: true

homebrew_casks:
  - name: world-cup-2026-cli-dashboard
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    license: "MIT"
    repository:
      owner: "{{ .Env.HOMEBREW_TAP_OWNER }}"
      name: "{{ .Env.HOMEBREW_TAP_REPO }}"
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: "{{ .Env.HOMEBREW_COMMIT_AUTHOR_NAME }}"
      email: "{{ .Env.HOMEBREW_COMMIT_AUTHOR_EMAIL }}"
