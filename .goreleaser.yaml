version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

universal_binaries:
  - replace: true

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

brews:
  - name: world-cup-2026-cli-dashboard
    homepage: "https://github.com/mansueli/world-cup-2026-cli-dashboard"
    description: "Watch live World Cup 2026 matches in your terminal"
    license: "MIT"
    directory: Formula
    repository:
      owner: "{{ .Env.HOMEBREW_TAP_OWNER }}"
      name: homebrew-world-cup-2026-cli-dashboard
      branch: main

    commit_author:
      name: "{{ .Env.HOMEBREW_COMMIT_AUTHOR_NAME }}"
      email: "{{ .Env.HOMEBREW_COMMIT_AUTHOR_EMAIL }}"
